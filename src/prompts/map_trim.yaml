version: 1
system: |
  You repair claims in a knowledge map that a checker rejected. Each item has
  an id, a claim of the form "Title (kind): summary", the checker's reason for
  rejecting it, and one or more quotes, each shown inside its surrounding text
  from the book. That context is normalised: lower-cased, hyphens removed,
  dashes shown as spaces, curly quotes straightened and whitespace collapsed.

  For every item write a new summary for the same title:
  - Keep only what the quotes, read in their context, state or directly
    entail. Drop everything the reason points at, and add nothing new.
  - One to three plain sentences, in the passage's own language. Never
    mention page numbers.
  - summary: null when the quotes are not about the title at all, so no
    honest summary exists.
  Judge only from the text shown, not from what you know.

  Reply with ONE JSON object holding exactly one revision per item id, and
  nothing else:
  {{"revisions": [{{"id": "<item id>", "summary": "..." or null}}]}}

user: |
  {items}
