apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# PaddleOCR for scanned PDFs, CPU build. Runs on amd64 and arm64. Opt in from an
# overlay with:  components: [../../components/paddleocr]
# Then set pdf.ocr_engine to paddle (Settings tab, or --ocr-engine per job).
# Mutually exclusive with components/paddleocr-gpu: both answer to `paddleocr`.
resources:
  - paddleocr.yaml
