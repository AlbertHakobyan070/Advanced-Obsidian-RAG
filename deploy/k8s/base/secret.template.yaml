# SECRET TEMPLATE -- keys only, no values, and deliberately NOT listed in
# kustomization.yaml: `kubectl apply -k` never applies it, and no secret value is
# ever written into a file in this repository.
#
# Create the two Secrets by hand instead. From the shell, so the value never lands
# on disk or in shell history files you keep:
#
#   kubectl create namespace noetrix
#
#   # The proxy's encryption key. 32 random bytes, hex. KEEP IT once set: change it
#   # and every provider key stored in the proxy reads "[decrypt failed]".
#   kubectl -n noetrix create secret generic noetrix-proxy \
#       --from-literal=ENCRYPTION_KEY="$(openssl rand -hex 32)"
#
#   # Provider keys for a DIRECT backend (optional -- the proxy holds its own), and
#   # FREELLMAPI_API_KEY, the proxy's OWN key, which every answer through it needs.
#   # Add only the ones you use; the names are the `api_key_env` values in the config.
#   kubectl -n noetrix create secret generic noetrix-provider-keys \
#       --from-literal=OPENAI_API_KEY=... --from-literal=HF_TOKEN=...
#
# or from a file you keep OUTSIDE the repo:  --from-env-file=/path/to/provider-keys.env
#
# In a real cluster, prefer a secret manager (External Secrets, Sealed Secrets, the
# cloud provider's CSI driver) that materialises Secrets with exactly these names
# and keys. The shape below is what they need to produce.
apiVersion: v1
kind: Secret
metadata:
  name: noetrix-proxy
  namespace: noetrix
type: Opaque
stringData:
  ENCRYPTION_KEY: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: noetrix-provider-keys
  namespace: noetrix
type: Opaque
stringData:
  # Every key is optional. Uncomment (and fill, out of band) what you use.
  # FREELLMAPI_API_KEY: ""     # the proxy's own key, from its dashboard's Keys page
  # OPENAI_API_KEY: ""
  # ANTHROPIC_API_KEY: ""
  # OPENROUTER_API_KEY: ""
  # GROQ_API_KEY: ""
  # DEEPSEEK_API_KEY: ""
  # MISTRAL_API_KEY: ""
  # NVIDIA_API_KEY: ""
  # TOGETHER_API_KEY: ""
  # MOONSHOT_API_KEY: ""
  # XAI_API_KEY: ""
  # MINIMAX_API_KEY: ""
  # HF_TOKEN: ""
  # The optional API token both RAG servers and the MCP server then require
  # (Authorization: Bearer <value>). The rag container reads this Secret via envFrom.
  # RAG_API_TOKEN: ""
  {}
