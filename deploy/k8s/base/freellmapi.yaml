# FreeLLMAPI: the OpenAI-compatible generation proxy (its upstream image, pinned by
# digest; amd64 + arm64). Provider keys are added through its dashboard and stored,
# encrypted with ENCRYPTION_KEY, on the volume below.
#
# ENCRYPTION_KEY comes from its own Secret (noetrix-proxy), not from the provider
# keys Secret the RAG reads, so the proxy never sees the RAG's keys and the RAG
# never sees this one. Keep the value once set: change it and every stored key
# reads "[decrypt failed]" (deploy/README.md).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: freellmapi
  labels:
    app.kubernetes.io/name: freellmapi
    app.kubernetes.io/component: proxy
spec:
  replicas: 1
  strategy:
    type: Recreate                # one writer on a ReadWriteOnce volume
  selector:
    matchLabels:
      app.kubernetes.io/name: freellmapi
  template:
    metadata:
      labels:
        app.kubernetes.io/name: freellmapi
        app.kubernetes.io/component: proxy
    spec:
      # No docker-link style variables (see rag.yaml): this image reads PORT, and a
      # Service named for another workload must not be able to shadow its settings.
      enableServiceLinks: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: freellmapi
          # Same digest as deploy/docker/docker-compose.yml: v0.14.0 by the image's
          # org.opencontainers.image.version label (what :latest was on 2026-10-13).
          # To move it:
          #   docker buildx imagetools inspect ghcr.io/tashfeenahmed/freellmapi:latest
          image: ghcr.io/tashfeenahmed/freellmapi@sha256:7719d9bdf41795d6a3e32a92324ae9a6c2e95e1fd2011e27d745d6b3a67935b5
          ports:
            - name: http
              containerPort: 3001
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3001"
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: noetrix-proxy
                  key: ENCRYPTION_KEY
          volumeMounts:
            - name: data
              mountPath: /app/server/data
          # Measured idle (docker stats, 2026-10-13): 59 MiB for the pinned build and
          # 88 MiB for the older build in use before it.
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          # /api/ping is what the image's own HEALTHCHECK uses: an unauthenticated 200
          # that proves the app is serving, which a bare port check cannot. NOT
          # /v1/models: the pinned build answers that with 401 without a key, so a
          # probe on it would never go ready (found by running the container).
          startupProbe:
            httpGet:
              path: /api/ping
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /api/ping
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/ping
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 4
          # UPSTREAM image: it declares USER root and its own entrypoint, which this
          # repo does not control. So unlike the images built here, no runAsNonRoot,
          # and no capability drop that has not been tried against that entrypoint.
          # Tightening it is a test to run (try runAsUser 1000, the image's `node`
          # user, with fsGroup 1000), not a setting to guess at.
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: freellmapi-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: freellmapi-data
  labels:
    app.kubernetes.io/name: freellmapi
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
# The name the config points at: providers.freellmapi.base_url is
# http://freellmapi:3001/v1 (deploy/docker/make_docker_config.py).
apiVersion: v1
kind: Service
metadata:
  name: freellmapi
  labels:
    app.kubernetes.io/name: freellmapi
    app.kubernetes.io/component: proxy
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: freellmapi
  ports:
    - name: http
      port: 3001
      targetPort: http
